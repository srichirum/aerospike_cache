services:

  # Manages the connection to the Aerospike Connection Manager (ACM) daemon.
  # Reads socket path and namespace from $settings (see README for keys).
  aerospike_cache.connection:
    class: Drupal\aerospike_cache\AerospikeConnection
    arguments: ['@settings']

  # Request-scoped collector of Aerospike cache activity (reads, writes,
  # failover). A no-op unless $settings['aerospike_cache_debug'] is TRUE, so it
  # carries no measurable overhead in production.
  aerospike_cache.stats:
    class: Drupal\aerospike_cache\AerospikeCacheStats
    arguments:
      - '@settings'
      # Lazy service closure: State (database-backed) is only resolved when
      # settings.php does not force the flag, keeping it off the early-bootstrap
      # cache path in the common case.
      - !service_closure '@state'

  # Adds X-Aerospike-Cache diagnostic headers when debug is on. A stack
  # middleware (priority 210) wrapping http_middleware.page_cache (200), so it
  # runs on every request — including anonymous page-cache hits — and writes
  # fresh headers that are never stored in the cached page response.
  http_middleware.aerospike_cache_stats:
    class: Drupal\aerospike_cache\StackMiddleware\AerospikeCacheStatsMiddleware
    arguments: ['@aerospike_cache.stats']
    tags:
      - { name: http_middleware, priority: 210 }

  # Alias so other services can inject the checksum provider by module name.
  # AerospikeCacheServiceProvider replaces the real definition at compile time.
  aerospike_cache.tags_checksum:
    alias: cache_tags.invalidator.checksum

  # Direct Aerospike cache factory. Use this when you want Aerospike only,
  # with no automatic fallback. All cache operations fail soft on ACM failure.
  cache.backend.aerospike:
    class: Drupal\aerospike_cache\AerospikeCacheBackendFactory
    arguments:
      - '@aerospike_cache.connection'
      - '@aerospike_cache.tags_checksum'
      - '@datetime.time'
      # Lazy service closure, not a direct reference: prevents the logger graph
      # from being traversed at compile time, which would otherwise form a
      # circular dependency via any site logger that depends on a cache backend.
      - !service_closure '@logger.factory'
      - '@aerospike_cache.stats'
    tags:
      - { name: cache.bin_factory }

  # Lock backend factory. Not wired in by default — to route Drupal's lock
  # service to Aerospike, override `lock` (and optionally `lock.persistent`)
  # in your site's services.yml. See the README "Locks" section.
  aerospike_cache.lock.factory:
    class: Drupal\aerospike_cache\Lock\AerospikeLockFactory
    arguments: ['@aerospike_cache.connection']

  # Aerospike cache factory with automatic database fallback.
  # On each request the ACM socket is probed once. If unreachable, all cache
  # operations for that request transparently route to the database backend.
  # Recovery is automatic — no deployment required when Aerospike comes back.
  # Recommended for production use over cache.backend.aerospike.
  cache.backend.aerospike_failover:
    class: Drupal\aerospike_cache\AerospikeFailoverCacheBackendFactory
    arguments:
      - '@cache.backend.aerospike'
      - '@cache.backend.database'
      - '@aerospike_cache.connection'
      # Lazy service closure — see note on cache.backend.aerospike above.
      - !service_closure '@logger.factory'
      - '@aerospike_cache.stats'
    tags:
      - { name: cache.bin_factory }
